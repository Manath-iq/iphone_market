# Отдельный «спейс» под демо RaXi: свой воркер, своя D1, свой KV.
name = "raxi-catalog"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/media/*", "/bot", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "raxi-catalog-db"
database_id = "e3a36b00-f7b9-43b6-bf26-c4e894ef7d38"
migrations_dir = "migrations"

# Медиа в KV (R2 на аккаунте не включён). Меняется в src/media.ts.
[[kv_namespaces]]
binding = "MEDIA"
id = "33ea1c0427ce467eab10a9c37c312cf8"

[ai]
binding = "AI"

# Workers Caching — только для медиа из Telegram (точка входа MediaCache, маршрут /media/f/<id>).
# Основная точка входа без кэша: иначе Cloudflare закэшировал бы ответы /api/* и считал запросы к статике.
# Файлы по одному id не меняются, поэтому кэш переживает деплои (cross_version_cache).
[cache]
enabled = false
cross_version_cache = true

[exports.MediaCache]
type = "worker"

  [exports.MediaCache.cache]
  enabled = true

[triggers]
# каждый час — проверка удалённых постов и докачка медиа; пн 07:00 UTC = 10:00 МСК — статистика
crons = ["0 * * * *", "0 7 * * 1"]

[vars]
BOT_USERNAME = "Raxi_store_bot"
# DEMO: разрешить чтение каталога без initData, чтобы ссылку можно было открыть и в браузере
PUBLIC_READ = "1"

# Секреты (wrangler secret put): BOT_TOKEN, ADMIN_IDS, WEBHOOK_SECRET, ADMIN_API_KEY
